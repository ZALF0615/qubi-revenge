.monitor{animation:crt-flicker 59s infinite}
.monitor::before{animation:none}

  background:linear-gradient(180deg,transparent 0 46%,#a1d8d811 48%,#05070824 50%,transparent 52%);
  mix-blend-mode:screen;animation:crt-interference 73s steps(1,end) infinite}

  0%,63.7%,63.95%,100%{filter:brightness(1)}
  63.8%{filter:brightness(.88)}
}

  0%,71.2%,71.45%,100%{opacity:0;transform:translateY(0)}

/* Round 1 completion: replace the eight password asterisks with Qubi digits. */
.password-cell .password-glyph{display:block;width:74%;height:auto;aspect-ratio:1 / 1;max-height:100%;object-fit:contain;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 3px #57ff8a55)}

.key .digit-glyph{display:none;position:absolute;left:50%;top:50%;width:clamp(16px,3vw,28px);height:clamp(16px,3vw,28px);transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;opacity:.92;}

.device.debug .key.hint-number::after{display:none;}

   but scale it to fill these larger square keycaps proportionally. */
.device.round1-hint-active:not([data-round="3"]) .panel .key{
  display:flex;align-items:center;justify-content:center;
  padding:0;
}

@keyframes qubi-joy-bounce{

/* Victory mini-boards inherit the round-two hint's row mapping, only when unlocked. */
.device.round2-hint-active[data-round="2"] .round2-win .mini-cell:is(.o,.x):nth-child(-n+3){color:#cb8178;}

// Render the original 5x5 design on a 10x10 pixel canvas: every source
// pixel becomes a 2x2 block, without changing Qubi's square silhouette.
function doubleQubiPixels(frame){
 return frame.flatMap(row=>{
  const doubled=[...row].map(pixel=>pixel+pixel).join('');
  return [doubled,doubled];
 });
}

 rows.forEach((row,y)=>{

     if(v==='1'){ctx.fillStyle=color;ctx.fillRect(x,y,1,1);}

 });
}

// Round 3: a three-digit base-3 typewriter.
// The 1/2/3, 4/5/6, 7/8/9 groups represent the 9s, 3s, and 1s places.
// Within each group, left-to-right means ternary digit 0/1/2.
// 000 (keys 147) is displayed as '-', and 001..222 (148..369) mean A..Z.
// Missing or multiple selections in a group are invalid and also display '-'.
function keysToLetter(groups){
 if(!groups.every(group=>group.length===1))return '-';
 const [[a],[b],[c]]=groups;
 const ordinal=(a-1)*9+(b-4)*3+(c-7);
 return ordinal===0?'-':String.fromCharCode(64+ordinal);
}
function keysForLetter(letter){
 const ordinal=letter.charCodeAt(0)-64; // A=1, ..., Z=26: no subtraction of 1.
 if(!Number.isInteger(ordinal)||ordinal<1||ordinal>26)return [1,4,7];
 return [1+Math.floor(ordinal/9),4+Math.floor(ordinal%9/3),7+ordinal%3];
}

// The original computer's 5x5 glyph algorithm, with the original word seeds.
// "힌트" (seed 100), "원하다" (seed 31), "응" (seed 72), "아니" (seed 73).
// Numerals copied from the original Qubi computer: base-five marker system.
// The lower row marks a number; the upper bar means five and center row is 1–4.
function originalDigitPattern(n){
 const five=n>=5, units=n%5;
 const rows=['00000','00000','00000','00000','11111'];
 if(five)rows[0]='11111';
 const mid=['0','0','0','0','0'];
 for(let k=0;k<units;k++)mid[k]='1';
 rows[2]=mid.join('');
 return rows;
}

function ensureKeyGlyph(button,wrapClass,canvasClass,labelText){

 let canvas,label;

  wrap=document.createElement('span');

  const inner=document.createElement('span');
  inner.className='translation-glyph';
  canvas=document.createElement('canvas');
  canvas.className=canvasClass;
  canvas.width=5;canvas.height=5;
  canvas.setAttribute('aria-hidden','true');
  label=document.createElement('span');
  label.className='translation-label';
  inner.append(canvas,label);
  wrap.appendChild(inner);

 }else{
  canvas=wrap.querySelector('canvas');
  label=wrap.querySelector('.translation-label');

function originalGlyph(seed){
 // In the source game these two word glyphs use dedicated UI runes,
 // not the procedurally generated symmetric word glyphs.
 if(seed===SOURCE_WORDS.indexOf('전송')+1)
  return ["11000","10000","10011","10000","11000"];
 if(seed===SOURCE_WORDS.indexOf('삭제')+1)
  return ["11111","01101","00110","00100","00000"];
 function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
 for(let attempt=0;;attempt++){
  const rnd=rng(seed*7919+attempt*104729+13);
  const g=Array.from({length:5},()=>Array(5).fill(0));
  let on=0;
  for(let y=0;y<5;y++)for(let x=0;x<3;x++){
   const v=rnd()<.46?1:0;
   g[y][x]=v;g[y][4-x]=v;
   if(v)on+=(x===2?1:2);
  }
  if(on>=7&&on<=18)return g.map(row=>row.join(''));
 }
}

function streamHintGlyphs(seeds,showChoices=true){

  if(!hintDialog.classList.contains('open')||token!==hintDialogueToken)return;

   gap.setAttribute('aria-hidden','true');
   hintDialogText.appendChild(gap);

   const canvas=document.createElement('canvas');

   drawPixelPattern(canvas,typeof glyph==='object'&&'digit' in glyph
    ? originalDigitPattern(glyph.digit) : originalGlyph(glyph));
   const wrap=document.createElement('span');
   wrap.className='translation-glyph';
   const label=document.createElement('span');
   label.className='translation-label';

    ? String(glyph.digit) : (SOURCE_WORDS[glyph-1]||'');
   wrap.append(canvas,label);
   hintDialogText.appendChild(wrap);

  // Keep the same short typing interval for repeated words as for ordinary speech.
  if(i<seeds.length)hintTypingTimer=setTimeout(next,130);

   hintTypingTimer=null;

     hintChoiceTimer=null;
     if(hintOpen&&token===hintDialogueToken)hintDialogActions.hidden=false;
    },400);
   }

 }

}

function outcome(state){
 for(const line of lines){const [a,b,c]=line;if(state[a]&&state[a]===state[b]&&state[a]===state[c])return state[a];}
 return state.every(Boolean)?'draw':null;
}
function minimax(state,turn,depth){
 const end=outcome(state);
 if(end==='X')return {score:10-depth};
 if(end==='O')return {score:depth-10};
 if(end==='draw')return {score:0};
 let best={score:turn==='X'?-Infinity:Infinity,index:-1};
 for(let i=0;i<9;i++){
  if(state[i])continue;
  state[i]=turn;
  const score=minimax(state,turn==='X'?'O':'X',depth+1).score;
  state[i]=null;
  if((turn==='X'&&score>best.score)||(turn==='O'&&score<best.score))best={score,index:i};
 }
 return best;
}
// Find an immediate three-in-a-row opportunity without mutating the live board.
function immediateWinningMove(state,mark){
 for(const [a,b,c] of lines){
  const line=[a,b,c];
  if(line.filter(i=>state[i]===mark).length!==2)continue;
  const empty=line.find(i=>state[i]===null);
  if(empty!==undefined)return empty;
 }
 return -1;
}
function aiMove(){
 if(round!==2||finished||!inputLocked)return;
 let position=immediateWinningMove(board,'X'); // 1. Take a win now if possible.
 if(position<0)position=immediateWinningMove(board,'O'); // 2. Otherwise block a one-move win.
 if(position<0){
  // Keep the deliberately imperfect opening only when no immediate threat exists.
  if(board.filter(Boolean).length===1&&board[4]==='O'){
   const edges=[1,3,5,7];position=edges[Math.floor(Math.random()*edges.length)];
  }else position=minimax(board.slice(),'X',0).index;
 }
 if(position>=0&&board[position]===null){
  board[position]='X';
  qubiReaction(140); // Brief eye blink exactly when Qubi places its mark.
  qubiMoveSound();   // Distinct from player's short confirmation sound.
 }
 inputLocked=false;
 settleBoard();
}
function settleBoard(){
 const result=outcome(board);
 if(result){
  finished=true;
  if(result==='O'){
   wins++;
   if(wins<3)ticTacToeWinSound(); // Each individual win gets a cheerful, brief cue.
   winSnapshots.push(board.slice());
   if(winSnapshots.length>3)winSnapshots=winSnapshots.slice(-3);
   if(wins>=3){
    clearSound();
    sayRoundClear();
    roundTransitioning=true;
    tttWinShow=true;
    updateHintAvailability();
    renderWinBoards();
    renderBoard(); // The victory screen remains inside the CRT until the next key press.
    return;
   }
  }else{
   // A loss or draw breaks the consecutive-win streak.
   wins=0;
   winSnapshots=[];
   recordRoundFailure();
   renderWinBoards();
   if(result==='X'){
    ticTacToeLoseSound(); // Rough three-note descending defeat cue.
    qubiTotalWins++;
    if(qubiTotalWins % 7 === 0){
     showQubiJoy();
    }
   }
  }
 }
 renderBoard();
 if(round===3)beginWordRound();
}
function ticTacToePress(digit){
 if(roundTransitioning)return;
 if(digit==='0'){
  ticTacToeResetSound();
  if(aiTimer!==null){clearTimeout(aiTimer);aiTimer=null;}
  qubiResetFace();
  board=Array(9).fill(null);finished=false;inputLocked=false;
  renderBoard();return;
 }
 if(inputLocked||finished)return;
 const index=Number(digit)-1;
 if(board[index])return;
 acceptedSound();
 board[index]='O';
 const result=outcome(board);
 if(result){settleBoard();return;}
 inputLocked=true;
 renderBoard();
 aiTimer=setTimeout(()=>{aiTimer=null;aiMove();},450);
}

function clearLights(){buttons.forEach(b=>b.classList.remove('lit'));}
const keyFlashTimers=new WeakMap();
function flashRoundOneKey(button){
 const prior=keyFlashTimers.get(button);
 if(prior!==undefined)clearTimeout(prior);
 button.classList.add('lit');
 const timer=setTimeout(()=>{
  keyFlashTimers.delete(button);
  if(round===1)button.classList.remove('lit');
 },150);
 keyFlashTimers.set(button,timer);
}
// Quiet CRT-style acknowledgement; only played for input the game accepts.
function playTone(frequency, when, duration, volume, type='sine'){
 const oscillator=soundContext.createOscillator(), gain=soundContext.createGain();
 oscillator.type=type;
 oscillator.frequency.setValueAtTime(frequency,when);
 gain.gain.setValueAtTime(.0001,when);
 gain.gain.linearRampToValueAtTime(volume,when+.008);
 gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
 oscillator.connect(gain).connect(soundContext.destination);
 oscillator.start(when);oscillator.stop(when+duration+.015);
}
function ensureSound(){
 soundContext??=new (window.AudioContext||window.webkitAudioContext)();
 if(soundContext.state==='suspended')soundContext.resume();
 return soundContext.currentTime;
}
/* Faithful synthesizer settings from the source "큐비의 컴퓨터" HTML. */
function originalBeep(frequency,duration,type='square',volume=.045,delay=0){
 const t=ensureSound()+delay;
 const oscillator=soundContext.createOscillator(),gain=soundContext.createGain();
 oscillator.type=type;oscillator.frequency.value=frequency;
 gain.gain.setValueAtTime(volume,t);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 oscillator.connect(gain).connect(soundContext.destination);
 oscillator.start(t);oscillator.stop(t+duration+.02);
}
function originalSendSound(){
 try{
  originalBeep(392,.06);
  originalBeep(523,.08,'square',.05,.06);
 }catch(e){}
}
function acceptedSound(){
 try{originalBeep(310,.045,'square',.05);}catch(e){}
}
function qubiMoveSound(){
 try{originalBeep(285,.045,'square',.05);}catch(e){}
}
// A short, gritty descending cancel/reset cue; sharper timbre than before,
// but still just two quick notes so it remains distinct from the three-note loss cue.
function ticTacToeResetSound(){
 try{
  const t=ensureSound();
  playTone(349.23,t,.075,.046,'sawtooth');
  playTone(261.63,t+.065,.105,.040,'sawtooth');
 }catch(e){}
}
// Per-match tic-tac-toe victory: the former short round-clear cue.
function ticTacToeWinSound(){
 try{
  const t=ensureSound();
  playTone(523.25,t,.11,.039,'triangle');
  playTone(659.25,t+.095,.11,.043,'triangle');
  playTone(880,t+.19,.16,.046,'triangle');
 }catch(e){/* Audio is optional. */}
}
// Tic-tac-toe defeat: a short, unmistakable retro-game defeat jingle.
// Keep the original wrong cue's gritty sawtooth character, but give it a
// distinct descending five-note phrase, a deep fall, and a held final note.
function ticTacToeLoseSound(){
 try{
  const t=ensureSound()+.025;
  const notes=[
   [246.94,0,   .16,.052],
   [220.00,.17, .16,.052],
   [185.00,.34, .19,.055],
   [146.83,.55, .23,.058],
   [98.00, .80, .44,.061]
  ];
  notes.forEach(([freq,offset,duration,volume])=>{
   playTone(freq,t+offset,duration,volume,'sawtooth');
  });
  // Quiet low fundamental gives the ending weight without turning it harsh.
  playTone(49,t+.80,.48,.019,'sine');
 }catch(e){/* Audio is optional. */}
}
// Round clear (rounds 1–3): just the opening ascent of the original unlock cue.
// The complete unlock melody stays reserved for the final game clear.
function clearSound(){
 try{
  [[262,0],[330,.12],[392,.24],[523,.36]]
   .forEach(([frequency,delay])=>originalBeep(frequency,.16,'square',.055,delay));
 }catch(e){/* Audio is optional. */}
}
// Long "unlock" celebration from the source HTML, reserved for final game completion.
// Call finalClearSound() when the final round is implemented.
function finalClearSound(){
 try{
  [[262,0],[330,.12],[392,.24],[523,.36],[392,.55],[523,.66],[659,.78],[784,.95]]
   .forEach(([frequency,delay])=>originalBeep(frequency,.16,'square',.055,delay));
  originalBeep(1046,.6,'triangle',.05,1.15);
 }catch(e){}
}
function failureSound(){
 // Original wrong-answer sound, intentionally separate from tic-tac-toe loss.
 try{
  originalBeep(130,.2,'sawtooth',.06);
  originalBeep(98,.25,'sawtooth',.06,.14);
 }catch(e){}
}
function press(digit,button){
 if(exploded||gameComplete)return;
 if(round===1 && round1Completed){
  ticTacToeWinSound(); // Short positive cue on entering round 2.
  round1Completed=false;
  round=2;
  entered='';board=Array(9).fill(null);finished=false;wins=0;qubiTotalWins=0;
  tttWinShow=false;winSnapshots=[];renderWinBoards();
  clearLights();renderBoard();
  sayRoundStart(2);
  return;
 }
 if(round===2 && tttWinShow){
  ticTacToeWinSound(); // Same short positive cue on entering round 3.
  // Any key advances from the victory screen; it is not passed to round three.
  tttWinShow=false;
  roundTransitioning=false;
  qubiResetFace();
  round=3;
  clearLights();
  beginWordRound();
  updateDebug();
  sayRoundStart(3);
  return;
 }
 if(round===2){ticTacToePress(digit);return;}
 if(round===3){wordPress(digit);return;}
 if(round!==1||inputLocked)return;
 const expected=target[entered.length];
 if(digit!==expected){
   recordRoundFailure();
   inputLocked=true;
   flashRoundOneKey(button); // Wrong presses still flash briefly.
   renderPassword(Math.min(target.length,entered.length+1));
   setTimeout(()=>failureSound(),120);
   setTimeout(()=>{entered='';clearLights();updateDebug();inputLocked=false;},390);
   return;
 }
 acceptedSound();
 entered+=digit;
 flashRoundOneKey(button); // Each correct input flashes only briefly.
 updateDebug();
 if(entered===target){
   round1Completed=true;
   updateHintAvailability();
   clearSound();
   sayRoundClear();
   clearLights();
   renderPassword(target.length); // Replace all 8 stars with source Qubi numeral glyphs.
   updateDebug();
 }
}
// Hidden easter egg: click the upper-left LED ten times within 2.5 s per click.
// The ?debug=1 URL parameter remains available for development.
const power=document.getElementById('power');
const explosionFlash=document.getElementById('explosion-flash');
// Original "큐비의 컴퓨터" self-destruct audio sequence, kept distinct from gameplay SFX.
function playBlast(){
 try{
  const t=ensureSound();
  const ctx=soundContext;
  const len=Math.floor(ctx.sampleRate*1.2);
  const buffer=ctx.createBuffer(1,len,ctx.sampleRate);
  const ch=buffer.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=ctx.createBufferSource(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buffer;
  lp.type='lowpass';lp.frequency.value=900;
  g.gain.value=.25;
  src.connect(lp).connect(g).connect(ctx.destination);
  src.start(t);
  originalBeep(60,1.0,'sine',.2);
  originalBeep(45,1.4,'sine',.15,.1);
 }catch(e){}
}
function selfDestruct(){
 if(exploded)return;
 exploded=true;inputLocked=true;
 // Tear down any open hint question (including its YES/NO choices) before
 // the blast. Cancel pending typing/choice timers so they cannot reappear.
 stopHintTyping();
 hintOpen=false;
 hintDialog.classList.remove('open');
 hintDialogActions.hidden=true;
 hintDialogText.replaceChildren();
 hintTrigger.hidden=true;
 hintTrigger.setAttribute('aria-expanded','false');
 pendingQubiAnnouncement=null;
 pendingQubiJoy=false;
 if(aiTimer!==null){clearTimeout(aiTimer);aiTimer=null;}
 device.classList.add('exploding');
 playBlast();
 let flashes=0;
 const warning=setInterval(()=>{
  // Original escalating alarm accompanies each flash.
  explosionFlash.style.opacity=flashes%2===0?'.25':'0';
  flashes++;
  try{originalBeep(1200-flashes*80,.08,'square',.08);}catch(e){}
  if(flashes>=8){clearInterval(warning);explosionFlash.style.opacity='0';}
 },120);
 setTimeout(()=>{
  playBlast();explosionFlash.style.transition='opacity .08s';explosionFlash.style.opacity='1';
  setTimeout(()=>{
   device.style.visibility='hidden';
   explosionFlash.style.transition='opacity .6s';explosionFlash.style.opacity='0';
   // Original final dying high-pitched tone sounds when CRT goes dark.
   setTimeout(()=>{
    const dead=document.getElementById('explosion-dead');dead.classList.add('show');
    const dot=document.getElementById('explosion-dot');
    try{originalBeep(2000,1.5,'sine',.02);}catch(e){}
    dot.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.2)'}],{duration:2500,fill:'forwards'});
   },900);
  },200);
 },1100);
}
power.addEventListener('click',()=>{
 if(exploded)return;
 ledClicks++;
 clearTimeout(ledClickTimer);
 ledClickTimer=setTimeout(()=>{ledClicks=0;},2500);
 // Original "큐비의 컴퓨터" LED click: a short rising beep on every click.
 try{originalBeep(500+ledClicks*60,.04,'square',.03);}catch(e){}
 if(ledClicks>=10){clearTimeout(ledClickTimer);ledClicks=0;selfDestruct();}
});
// Original-style translation secret: arm with right-click on the power LED,
// then right-click it ten more times to open the password prompt.
let secretArmed=false,secretRightClicks=0,secretRightTimer=null;
const secretPrompt=document.getElementById('secretPrompt');
const secretInput=document.getElementById('secretInput');
const secretFeedback=document.getElementById('secretFeedback');
const secretTitle=document.getElementById('secretTitle');
for(const word of ['암호','무엇']){
 const cv=document.createElement('canvas');cv.width=5;cv.height=5;
 drawPixelPattern(cv,originalGlyph(SOURCE_WORDS.indexOf(word)+1));
 secretTitle.appendChild(cv);
}
function closeSecretPrompt(){
 secretPrompt.classList.remove('show');secretPrompt.setAttribute('aria-hidden','true');
 secretInput.value='';secretFeedback.textContent='';
}
function openSecretPrompt(){
 if(exploded)return;
 secretRightClicks=0;
 secretPrompt.classList.add('show');secretPrompt.setAttribute('aria-hidden','false');
 secretInput.value='';secretFeedback.textContent='';secretInput.focus();
}
power.addEventListener('contextmenu',event=>{
 event.preventDefault();event.stopPropagation();
 if(exploded)return;
 if(!secretArmed){
  secretArmed=true;power.classList.add('secret-armed');
  secretRightClicks=0;
 }else{
  secretRightClicks++;
  if(secretRightTimer!==null)clearTimeout(secretRightTimer);
  secretRightTimer=setTimeout(()=>{secretRightClicks=0;secretRightTimer=null;},2500);
  if(secretRightClicks>=10){
   secretRightClicks=0;clearTimeout(secretRightTimer);secretRightTimer=null;
   openSecretPrompt();
  }
 }
 try{originalBeep(500+secretRightClicks*60,.04,'square',.03);}catch(e){}
});
secretPrompt.addEventListener('click',event=>{if(event.target===secretPrompt)closeSecretPrompt();});
secretInput.addEventListener('keydown',event=>{
 event.stopPropagation();
 if(event.key==='Escape'){closeSecretPrompt();return;}
 if(event.key!=='Enter')return;
 event.preventDefault();
 if(secretInput.value.trim().toLowerCase()==='whateverland'){
  document.body.classList.toggle('translation-on');
  try{originalBeep(880,.1,'square',.06);setTimeout(()=>originalBeep(1320,.14,'square',.06),100);}catch(e){}
  closeSecretPrompt();
 }else{
  try{wrongSound();}catch(e){}
  secretInput.value='';secretFeedback.textContent='✕';
  secretInput.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:160,iterations:2});
 }
});
// Suppress the browser menu on the rest of the cabinet as in the source game.
document.addEventListener('contextmenu',event=>event.preventDefault());
// The original game's lightweight source/DevTools shortcut deterrent.
// Browser tools cannot be fully disabled by a web page.
document.addEventListener('keydown',event=>{
 const key=event.key.toLowerCase();
 const modifier=event.ctrlKey||event.metaKey;
 const blocked=event.key==='F12'||
  (modifier&&(key==='u'||key==='s'))||
  (modifier&&event.shiftKey&&['i','j','c'].includes(key));
 if(!blocked)return;
 event.preventDefault();
 event.stopPropagation();
 try{originalBeep(180,.10,'sawtooth',.06);}catch(e){}
 qubiReaction(400);
},true);
// Preserve text entry in the hidden translation password field.
document.addEventListener('selectstart',event=>{
 if(!event.target.closest('input,textarea,[contenteditable="true"]'))event.preventDefault();
});

// Development controls are isolated from the normal keyboard and can be switched
// independently for each stage. Disabling a hint removes its visual reward.
const debugHintChecks=[...document.querySelectorAll('[data-debug-hint]')];
function setDebugHint(stage,enabled){
 debugHintOverrides[stage]=enabled;
 if(stage===1){
  if(enabled)revealRoundOneNumberHint();
  else{
   device.classList.remove('round1-hint-active');
   buttons.forEach(button=>button.classList.remove('hint-number'));
  }
 }else if(stage===2){
  device.classList.toggle('round2-hint-active',enabled);
 }else if(stage===3){
  if(enabled)revealRoundThreeNumberHint();
  else device.classList.remove('round3-hint-active');
 }
 updateDebug();
}
function debugGoToRound(next){
 if(exploded||![1,2,3].includes(next))return;
 gameComplete=false;
 device.classList.remove('game-complete');
 if(aiTimer!==null){clearTimeout(aiTimer);aiTimer=null;}
 stopHintTyping();
 hintOpen=false;
 hintDialog.classList.remove('open');
 hintDialogActions.hidden=true;
 hintDialogText.replaceChildren();
 hintTrigger.setAttribute('aria-expanded','false');
 pendingQubiAnnouncement=null;
 pendingQubiJoy=false;
 qubiResetFace();
 if(qubiJoyTimer!==null){clearTimeout(qubiJoyTimer);qubiJoyTimer=null;}
 qubiFaceCanvas.classList.remove('qubi-joy');
 round=next;
 inputLocked=false;roundTransitioning=false;tttWinShow=false;
 round1Completed=false;entered='';
 board=Array(9).fill(null);wins=0;finished=false;qubiTotalWins=0;
 winSnapshots=[];renderWinBoards();
 wordInput='';wordGroups=[[],[],[]];hintRunning=false;
 clearLights();
 placeholder.textContent='';
 if(next===2)renderBoard();
 else if(next===3)renderWord();
 else updateDebug();
}
document.getElementById('debugRoundSelect').addEventListener('change',event=>{
 debugGoToRound(Number(event.target.value));
});
debugHintChecks.forEach(check=>check.addEventListener('change',()=>{
 setDebugHint(Number(check.dataset.debugHint),check.checked);
}));
const params=new URLSearchParams(location.search);
if(params.get('debug')==='1')device.classList.add('debug');
updateDebug();
// Source-style boot noise: 3 rows, 6–15 randomly placed 1px dots
// inside separate 5x5 canvases, appearing at 200ms intervals.
(async()=>{
 const noiseRoot=document.getElementById('crtBootNoise');
 for(let r=0;r<3;r++){
  const line=document.createElement('div');
  line.className='noise';
  const n=6+Math.floor(Math.random()*10);
  for(let k=0;k<n;k++){
   const cv=document.createElement('canvas');
   cv.width=5;cv.height=5;
   const ctx=cv.getContext('2d');
   ctx.fillStyle='#123a3e'; // original #1d4d2e, recolored to muted teal
   ctx.fillRect(Math.floor(Math.random()*5),Math.floor(Math.random()*5),1,1);
   const wrap=document.createElement('span');
   wrap.className='g';
   wrap.style.transform=`translate(${Math.floor(Math.random()*9)-4}px,${Math.floor(Math.random()*19)-9}px)`;
   wrap.appendChild(cv);line.appendChild(wrap);
  }
  noiseRoot.appendChild(line);
  if(r<2)await new Promise(resolve=>setTimeout(resolve,200));
 }
})();
playOpeningGreeting();
})();
